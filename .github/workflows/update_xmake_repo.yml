name: Update xmake-repo Version

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  update-repo:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout 当前源码仓库
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 创建 GitHub Release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          if ! gh release view "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes

            echo "Release $TAG_NAME created."
          else
            echo "Release $TAG_NAME already exists."
          fi

      # 3. 下载 Release 源码归档并计算 SHA256
      - name: Calculate Release SHA256
        id: calc_sha
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          # xmake 版本去掉 v 前缀
          VERSION="${TAG_NAME#v}"

          # GitHub 自动生成的 Release 源码归档
          ARCHIVE_URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG_NAME}.tar.gz"

          curl -fL --retry 3 "$ARCHIVE_URL" -o source.tar.gz

          SHA256=$(sha256sum source.tar.gz | awk '{print $1}')

          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

          echo "Tag: $TAG_NAME"
          echo "Version: $VERSION"
          echo "SHA256: $SHA256"

      # 4. Checkout 私有 xmake 仓库
      - name: Checkout xmake-repo
        uses: actions/checkout@v4
        with:
          repository: CottonTnT/my-xmake-repo
          token: ${{ secrets.XMAKE_REPO_TOKEN }}
          path: xmake-repo-local
          fetch-depth: 0
          ref: main

      # 5. 更新 xmake.lua
      - name: Update xmake.lua
        shell: bash
        run: |
          LUA_PATH="xmake-repo-local/packages/c/common/xmake.lua"

          if [ ! -f "$LUA_PATH" ]; then
            echo "Error: $LUA_PATH not found!"
            exit 1
          fi

          python3 - "$LUA_PATH" "$VERSION" "$SHA256" <<'PY'
          import sys
          import re

          path, version, sha256 = sys.argv[1:]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # 查找已有版本
          pattern = re.compile(
              r'(?m)^([ \t]*)add_versions\(\s*["\']'
              + re.escape(version)
              + r'["\']\s*,\s*["\'][^"\']*["\']\s*\)'
          )

          new_line = f'    add_versions("{version}", "{sha256}")'

          if pattern.search(content):
              # 已有版本则更新 SHA256
              content = pattern.sub(new_line, content, count=1)
              print(f"Updated version {version}")
          else:
              # 新版本插入 package_end() 前
              content, count = re.subn(
                  r'(?m)^([ \t]*)package_end\(\)',
                  lambda m: new_line + '\n' + m.group(0),
                  content,
                  count=1
              )

              if count == 0:
                  print("Error: package_end() not found!")
                  sys.exit(1)

              print(f"Added version {version}")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      # 6. Commit and Push
      - name: Commit and Push
        shell: bash
        run: |
          cd xmake-repo-local

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add packages/c/common/xmake.lua

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Common: update version to ${VERSION}"

          git push origin HEAD:main
